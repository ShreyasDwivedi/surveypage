<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-[#f5f7fb] text-[#43567d] font-sans">

    <div class="max-w-[1200px] mx-auto p-4 md:p-7">

        <!--TOP BAR-->
        <div class="flex justify-between items-center mb-6">

            <div class="text-2xl font-extrabold text-[#172033]">
                Market<span class="text-[#356ae6]">View</span>
            </div>

            <div class="flex gap-2.5">

                <button
                    class="hidden sm:block border border-[#e5e9f0] bg-white rounded-lg px-4 py-2.5 cursor-pointer hover:bg-gray-50">
                    🔔 Alerts
                </button>

                <button
                    class="bg-[#356ae6] text-white border border-[#356ae6] rounded-lg px-4 py-2.5 cursor-pointer hover:bg-blue-700">
                    Sign In
                </button>

            </div>
        </div>

        <div class="bg-gradient-to-br from-[#172033] to-[#2c3e68] text-white rounded-2xl p-6 md:p-8 mb-6">

            <h1 class="m-0 mb-2 text-2xl md:text-3xl font-bold">
                Markets
            </h1>

            <p class="m-0 text-[#cbd5e7]">
                Explore stocks, compare performance & discover opportunities.
            </p>

            <div class="mt-5 bg-white rounded-lg p-3 flex gap-2.5 items-center">

                <span class="text-gray-500">🔍</span>

                <input id="search" type="text" placeholder="Search stocks..."
                    class="border-0 outline-none w-full text-[15px] text-gray-800">

            </div>

        </div>

        <div class="text-lg font-bold mt-6 mb-3">
            Market Indices
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="bg-white border border-[#e5e9f0] rounded-xl p-[18px] shadow-[0_3px_12px_rgba(24,35,58,0.03)]">

                <div class="flex justify-between text-sm text-gray-500">
                    <b class="text-[#43567d]">NIFTY 50</b>
                    <span>🇮🇳 NSE</span>
                </div>

                <div class="text-[25px] font-extrabold text-[#172033] mt-2.5 mb-1">
                    24,835.15
                </div>

                <div class="text-[#12a66a]">
                    ▲ +0.82%
                </div>

            </div>

            <div class="bg-white border border-[#e5e9f0] rounded-xl p-[18px] shadow-[0_3px_12px_rgba(24,35,58,0.03)]">

                <div class="flex justify-between text-sm text-gray-500">
                    <b class="text-[#43567d]">SENSEX</b>
                    <span>🇮🇳 BSE</span>
                </div>

                <div class="text-[25px] font-extrabold text-[#172033] mt-2.5 mb-1">
                    81,926.44
                </div>

                <div class="text-[#12a66a]">
                    ▲ +0.64%
                </div>

            </div>

            <div class="bg-white border border-[#e5e9f0] rounded-xl p-[18px] shadow-[0_3px_12px_rgba(24,35,58,0.03)]">

                <div class="flex justify-between text-sm text-gray-500">
                    <b class="text-[#43567d]">BANK NIFTY</b>
                    <span>🇮🇳 NSE</span>
                </div>

                <div class="text-[25px] font-extrabold text-[#172033] mt-2.5 mb-1">
                    55,421.30
                </div>

                <div class="text-[#e34d59]">
                    ▼ -0.21%
                </div>

            </div>

        </div>

        <div class="flex gap-2 mt-6 mb-5 overflow-x-auto">

            <button
                class="tab bg-[#43567d] text-white border border-[#43567d] px-4 py-2.5 rounded-lg whitespace-nowrap cursor-pointer"
                data-filter="all">
                All Stocks
            </button>

            <button
                class="tab bg-white border border-[#e5e9f0] px-4 py-2.5 rounded-lg whitespace-nowrap cursor-pointer hover:bg-gray-50"
                data-filter="gainer">
                Top Gainers
            </button>

            <button
                class="tab bg-white border border-[#e5e9f0] px-4 py-2.5 rounded-lg whitespace-nowrap cursor-pointer hover:bg-gray-50"
                data-filter="loser">
                Top Losers
            </button>

            <button
                class="tab bg-white border border-[#e5e9f0] px-4 py-2.5 rounded-lg whitespace-nowrap cursor-pointer hover:bg-gray-50"
                data-filter="active">
                Most Active
            </button>

        </div>

        <div class="text-lg font-bold mt-6 mb-3">
            Stock Screener
        </div>

        <div class="flex flex-wrap gap-3 bg-white p-4 border border-[#e5e9f0] rounded-xl">


            <select id="sector"
                class="border border-[#e5e9f0] rounded-lg px-3 py-2.5 bg-white text-[#43567d] outline-none focus:ring-2 focus:ring-blue-200">

                <option value="all">All Sectors</option>
                <option>IT</option>
                <option>Banking</option>
                <option>Energy</option>
                <option>Auto</option>

            </select>

            <select id="change"
                class="border border-[#e5e9f0] rounded-lg px-3 py-2.5 bg-white text-[#43567d] outline-none focus:ring-2 focus:ring-blue-200">

                <option value="all">Any Change</option>
                <option value="positive">Positive</option>
                <option value="negative">Negative</option>

            </select>

            <select id="sort"
                class="border border-[#e5e9f0] rounded-lg px-3 py-2.5 bg-white text-[#43567d] outline-none focus:ring-2 focus:ring-blue-200">

                <option value="default">Sort: Default</option>
                <option value="price">Price: High to Low</option>
                <option value="change">Change: High to Low</option>
                <option value="volume">Volume: High to Low</option>

            </select>

            <button id="apply"
                class="bg-[#356ae6] text-white border border-[#356ae6] rounded-lg px-4 py-2.5 cursor-pointer hover:bg-blue-700">

                Apply Filters

            </button>

        </div>

        <div class="mt-5 bg-white border border-[#e5e9f0] rounded-xl overflow-hidden">

            <div class="p-[18px] font-bold border-b border-[#e5e9f0]">
                Stocks
            </div>

            <div class="overflow-x-auto">

                <table class="w-full border-collapse">

                    <thead>

                        <tr class="bg-[#fafbfc]">

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                Company
                            </th>

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                Price
                            </th>

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                Change
                            </th>

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                %
                            </th>

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                Volume
                            </th>

                            <th
                                class="text-left p-[15px_18px] border-b border-[#e5e9f0] text-sm text-gray-500 font-semibold">
                                Watch
                            </th>

                        </tr>

                    </thead>

                    <tbody id="stocks"></tbody>

                </table>


                <div id="empty" class="text-center p-9 text-gray-500" style="display:none">

                    No stocks found.

                </div>

            </div>

        </div>

    </div>

    <script>

        const data = [

            {
                name: "Reliance Industries",
                symbol: "RELIANCE",
                sector: "Energy",
                price: 2700,
                change: 80,
                pct: 3.2,
                volume: 2.4,
                type: "gainer"
            },

            {
                name: "Tata Consultancy Services",
                symbol: "TCS",
                sector: "IT",
                price: 3840,
                change: 45,
                pct: 1.2,
                volume: 1.8,
                type: "gainer"
            },

            {
                name: "Infosys",
                symbol: "INFY",
                sector: "IT",
                price: 1520,
                change: -30,
                pct: -1.9,
                volume: 3.1,
                type: "loser"
            },

            {
                name: "HDFC Bank",
                symbol: "HDFCBANK",
                sector: "Banking",
                price: 1740,
                change: 22,
                pct: 1.3,
                volume: 2.7,
                type: "gainer"
            },

            {
                name: "Tata Motors",
                symbol: "TATAMOTORS",
                sector: "Auto",
                price: 980,
                change: -18,
                pct: -1.8,
                volume: 4.2,
                type: "loser"
            },

            {
                name: "ICICI Bank",
                symbol: "ICICIBANK",
                sector: "Banking",
                price: 1320,
                change: 16,
                pct: 1.2,
                volume: 3.8,
                type: "active"
            },

            {
                name: "Bharti Airtel",
                symbol: "BHARTIARTL",
                sector: "Telecom",
                price: 1880,
                change: 31,
                pct: 1.7,
                volume: 3.5,
                type: "active"
            }

        ];

        const tbody = document.getElementById("stocks");
        const empty = document.getElementById("empty");

        let currentFilter = "all";


        function render() {

            let q =
                document.getElementById("search")
                    .value
                    .toLowerCase();

            let sector =
                document.getElementById("sector").value;

            let change =
                document.getElementById("change").value;

            let sort =
                document.getElementById("sort").value;


            let rows = data.filter(x =>

                (currentFilter === "all" ||
                    x.type === currentFilter)

                &&

                (
                    x.name.toLowerCase().includes(q) ||
                    x.symbol.toLowerCase().includes(q)
                )

                &&

                (sector === "all" ||
                    x.sector === sector)

                &&

                (
                    change === "all" ||

                    (change === "positive" &&
                        x.pct > 0) ||

                    (change === "negative" &&
                        x.pct < 0)
                )

            );

            if (sort === "price") {
                rows.sort((a, b) =>
                    b.price - a.price
                );
            }

            if (sort === "change") {
                rows.sort((a, b) =>
                    b.pct - a.pct
                );
            }

            if (sort === "volume") {
                rows.sort((a, b) =>
                    b.volume - a.volume
                );
            }

            tbody.innerHTML = rows.map(x => {

                const positive = x.change >= 0;

                return `

                    <tr class="hover:bg-gray-50">

                        <td class="p-[15px_18px] border-b border-[#e5e9f0]">

                            <div class="font-bold text-[#172033]">
                                ${x.name}
                            </div>

                            <div class="text-xs text-gray-500 mt-1">
                                ${x.symbol}
                            </div>

                        </td>


                        <td class="p-[15px_18px] border-b border-[#e5e9f0]">
                            ₹${x.price.toLocaleString("en-IN")}
                        </td>


                        <td
                            class="p-[15px_18px] border-b border-[#e5e9f0]
                            ${positive ? "text-[#12a66a]" : "text-[#e34d59"}">

                            ${positive ? "+" : "-"}₹${Math.abs(x.change)}

                        </td>


                        <td
                            class="p-[15px_18px] border-b border-[#e5e9f0]
                            ${x.pct >= 0 ? "text-[#12a66a]" : "text-[#e34d59"}">

                            ${x.pct >= 0 ? "+" : ""}${x.pct}%

                        </td>


                        <td class="p-[15px_18px] border-b border-[#e5e9f0]">
                            ${x.volume.toFixed(1)}M
                        </td>


                        <td class="p-[15px_18px] border-b border-[#e5e9f0]">

                            <button
                                class="text-lg cursor-pointer hover:scale-110 transition"
                                onclick="this.textContent =
                                this.textContent === '☆' ? '★' : '☆'">

                                ☆

                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

            empty.style.display =
                rows.length ? "none" : "block";

        }

        document
            .getElementById("search")
            .addEventListener("input", render);


        document
            .getElementById("apply")
            .addEventListener("click", render);



        ["sector", "change", "sort"].forEach(id => {

            document
                .getElementById(id)
                .addEventListener("change", render);

        });


        document
            .querySelectorAll(".tab")
            .forEach(btn => {

                btn.addEventListener("click", () => {

                    document
                        .querySelectorAll(".tab")
                        .forEach(b => {

                            b.classList.remove(
                                "bg-[#43567d]",
                                "text-white"
                            );

                            b.classList.add(
                                "bg-white"
                            );

                        });


                    btn.classList.remove(
                        "bg-white"
                    );

                    btn.classList.add(
                        "bg-[#43567d]",
                        "text-white"
                    );


                    currentFilter =
                        btn.dataset.filter;

                    render();

                });

            });

        render();

    </script>

</body>

</html>
